/* ── HELPERS ───────────────────────────────────────────────────── */
function prCalc(recs){
  var p=0,f=0;
  recs.forEach(function(r){if(r[5]==="P")p++;else if(r[5]==="F")f++;});
  return p+f>0?Math.round(p/(p+f)*1000)/10:null;
}
function pct(v,t){return t>0?Math.round(v/t*10)/10:0}
function esc(s){
  return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function prB(r){
  if(r===null||r===undefined)return "<span style=\"color:var(--muted)\">-</span>";
  var n=parseFloat(r);
  var c=n>=80?"prg":n>=65?"pra":"prr";
  return "<span class=\"prb "+c+"\">"+n.toFixed(1)+"%</span>";
}
function stB(s){
  var c=s==="P"||s==="Passed"?"bp":s==="F"||s==="Failed"?"bf":"bn";
  var l=s==="P"?"Passed":s==="F"?"Failed":"Pending";
  return "<span class=\"b "+c+"\">"+l+"</span>";
}
function regB(r){
  var m={ME:"bme",KWT:"bkw",Africa:"baf",LATAM:"bla"};
  return "<span class=\"b "+(m[r]||"bot")+"\">"+r+"</span>";
}
function scoreBar(v){
  if(!v)return "<span style=\"color:var(--muted)\">-</span>";
  var c=v>=80?"#43A047":v>=60?"#FFA726":"#E53935";
  return "<div class=\"sbar\"><div class=\"sbtr\"><div class=\"sbfi\" style=\"width:"+Math.min(v,100)+"%;background:"+c+"\"></div></div><span style=\"font-size:10px;font-weight:700;color:"+c+"\">"+v+"</span></div>";
}

  var el=document.getElementById(id);

  CH[id]=new Chart(el,cfg);
}

function renderOff(){

function renderCrsChart(){
  var fd=fSLM();
  var cm={};
  fd.forEach(function(r){if(!r[1])return;if(!cm[r[1]])cm[r[1]]={p:0,f:0};cm[r[1]][r[5]==="P"?"p":"f"]++;});
  var top=Object.entries(cm).sort(function(a,b){return(b[1].p+b[1].f)-(a[1].p+a[1].f)}).slice(0,15);
  mkCh("cc1",{type:"bar",data:{
    labels:top.map(function(x){return x[0].length>30?x[0].slice(0,28)+"..":x[0]}),
    datasets:[
      {label:"Passed",data:top.map(function(x){return x[1].p}),backgroundColor:"#1B5E20",stack:"s",borderRadius:3},
      {label:"Failed",data:top.map(function(x){return x[1].f}),backgroundColor:"#B71C1C",stack:"s",borderRadius:3}
    ]},
    options:{indexAxis:"y",responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:TIP},
      scales:{x:{stacked:true,grid:{color:GC},ticks:{color:"#7A9AB5",font:{size:10}}},
              y:{stacked:true,grid:{color:GC},ticks:{color:"#7A9AB5",font:{size:10},maxTicksLimit:15}}}}});
}
function renderCrs(){
  var q=(sel("csr")||"").toLowerCase();
  var fd=fSLM();
  var cm={};
  fd.forEach(function(r){
    if(!r[1])return;
    if(!cm[r[1]])cm[r[1]]={t:0,p:0,f:0,sc:[],offs:[]};
    cm[r[1]].t++;
    if(r[5]==="P")cm[r[1]].p++;else if(r[5]==="F")cm[r[1]].f++;
    if(r[6])cm[r[1]].sc.push(r[6]);
    if(r[8]&&cm[r[1]].offs.indexOf(r[8])<0)cm[r[1]].offs.push(r[8]);
  });
  var data=Object.keys(cm).map(function(c){
    var v=cm[c];
    return{course:c,t:v.t,p:v.p,f:v.f,offs:v.offs.length,
      pr:v.p+v.f>0?Math.round(v.p/(v.p+v.f)*1000)/10:null,
      sc:v.sc.length?Math.round(v.sc.reduce(function(a,b){return a+b},0)/v.sc.length*10)/10:null};
  }).filter(function(c){return!q||c.course.toLowerCase().includes(q)})
    .sort(function(a,b){return b.t-a.t});
  var cnt=gel("ccnt");if(cnt)cnt.textContent=data.length+" courses";
  var h="<thead><tr><th>Course</th><th>Total</th><th>Offerings</th><th>Passed</th><th>Failed</th><th>Pass Rate</th><th>Avg Score</th></tr></thead><tbody>";
  data.forEach(function(c){
    h+="<tr><td style=\"max-width:220px;overflow:hidden;text-overflow:ellipsis;font-weight:500\">"+esc(c.course)+"</td>"
      +"<td style=\"font-weight:700\">"+c.t+"</td><td style=\"color:var(--muted)\">"+c.offs+"</td>"
      +"<td style=\"color:#66BB6A;font-weight:600\">"+c.p+"</td><td style=\"color:#EF5350\">"+c.f+"</td>"
      +"<td>"+prB(c.pr)+"</td><td>"+scoreBar(c.sc)+"</td></tr>";
  });
  var tEl=gel("tc");if(tEl)tEl.innerHTML=h+"</tbody>";
}

  return s||"Unknown";
}

      +"<div class=\"fi\"><label>Start Date *</label><input type=\"date\" id=\"fd\" value=\""+today+"\"></div>"
      +"<div class=\"fi\"><label>End Date</label><input type=\"date\" id=\"fe\"></div>"
      +"<div class=\"fi\"><label>Status *</label><select id=\"fs\"><option value=\"\">Select status</option><option>Passed</option><option>Failed</option><option>Pending</option></select></div>"
      +"<div class=\"fi\"><label>Score (0-100)</label><input type=\"number\" id=\"fsc\" placeholder=\"e.g. 78.5\" min=\"0\" max=\"100\" step=\"0.1\"></div>"
      +"<div class=\"fi\"><label>Training Hours</label><input type=\"number\" id=\"fh\" placeholder=\"e.g. 120\" min=\"0\"></div>"
      +"<div class=\"fi\"><label>Position</label><input type=\"text\" id=\"fp\" placeholder=\"e.g. Field Engineer\"></div>"
      +"<div class=\"fi\"><label>Grade</label><select id=\"fg\"><option value=\"\">Optional</option>"+gOpts+"</select></div>"
      +"<div class=\"fi\"><label>Offering ID (auto)</label>"
        +"<input type=\"text\" id=\"fo\" readonly class=\"auto\" placeholder=\"Auto from course+location+date\">"
        +"<div style=\"display:flex;gap:6px;margin-top:4px;align-items:center\">"
          +"<span style=\"font-size:10px;color:var(--dim)\">Seq (2nd run same month):</span>"
          +"<select id=\"fq\" style=\"background:var(--s2);border:1px solid var(--b1);color:var(--tx);padding:3px 8px;border-radius:5px;font-size:10px;outline:none\">"
            +"<option value=\"\">(none)</option>"
            +"<option value=\"_2nd\">_2nd</option>"
            +"<option value=\"_3rd\">_3rd</option>"
            +"<option value=\"_4th\">_4th</option>"
          +"</select></div>"
      +"</div>"
    +"</div>"
    +"<div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap\">"
      +"<button class=\"btn btnt\" id=\"btn-save\">"+(isEdit?"Update Record":"Save Record")+"</button>"
      +(isEdit?"<button class=\"btn btng\" id=\"btn-cancel-edit\">Cancel Edit</button>":"")
      +"<button class=\"btn btng\" id=\"btn-clear\">Clear Form</button>"
      +"<span id=\"fmsg\" style=\"font-size:12px;font-weight:600\"></span>"
    +"</div></div>"
    +"<div class=\"sc\"><div class=\"sh\"><div class=\"st\"><div class=\"sd\" style=\"background:var(--amber)\"></div>Saved Records <span id=\"scnt\" style=\"color:var(--muted);font-weight:400;font-size:11px\"></span></div>"
      +"<div style=\"display:flex;gap:8px\">"
        +"<button class=\"btn btng\" id=\"btn-export\" style=\"font-size:10px;padding:5px 12px\">Export CSV</button>"
        +"<button class=\"btn btnr\" id=\"btn-clearall\" style=\"font-size:10px;padding:5px 12px\">Clear All</button>"
      +"</div></div>"
      +"<div id=\"slist\" style=\"display:flex;flex-direction:column;gap:8px\"></div>"
      +"<div id=\"snone\" style=\"text-align:center;padding:28px;color:var(--dim);font-style:italic;font-size:12px\">No records saved yet.</div>"
    +"</div>";

  // Wire up auto-fill
  function autoReg(){var loc=sel("fl");var e=gel("fR");if(e)e.value=LR[loc]||"";autoOID();}
  function autoOID(){
    var c=sel("fc"),l=sel("fl"),d=sel("fd"),q=sel("fq")||"";
    if(!c||!l||!d){setV("fo","");return;}
    var ca=CA[c]||c.replace(/\s+/g,"_").slice(0,10);
    var dt=new Date(d);
    var ms=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    setV("fo",ca+"_"+l+"_"+ms[dt.getMonth()]+String(dt.getFullYear()).slice(2)+q);
  }
  gel("fl").addEventListener("change",autoReg);
  gel("fc").addEventListener("change",autoOID);
  gel("fd").addEventListener("change",autoOID);
  gel("fq").addEventListener("change",autoOID);

  // Pre-fill if editing
  if(isEdit){
    var saved=getSaved();
    var rec=saved.find(function(r){return r._id===EDITING_NR});
    if(rec){
      setV("fn",rec.name);setV("fb",rec.badge);setV("fc",rec.course);
      setV("fl",rec.loc);setV("fC",rec.country);setV("fd",rec.start);
      setV("fe",rec.end||"");setV("fs",rec.status);setV("fsc",rec.score||"");
      setV("fh",rec.hours||"");setV("fp",rec.position||"");setV("fg",rec.grade||"");
      autoReg();
    }
  }

  // Save
  gel("btn-save").addEventListener("click",function(){
    var name=sel("fn").trim(),course=sel("fc"),loc=sel("fl"),
        country=sel("fC"),start=sel("fd"),status=sel("fs");
    var msg=gel("fmsg");
    if(!name||!course||!loc||!country||!start||!status){
      msg.style.color="#EF5350";msg.textContent="Fill all required fields (*)";
      setTimeout(function(){msg.textContent=""},3000);return;
    }
    var sc=parseFloat(sel("fsc"));
    var rec={
      _id:EDITING_NR||(Date.now()),
      name:name,badge:sel("fb"),course:course,loc:loc,
      country:country,region:LR[loc]||"Other",
      start:start,end:sel("fe")||"",status:status,
      score:sc>0?Math.round(sc*10)/10:null,
      hours:parseFloat(sel("fh"))||0,
      position:sel("fp"),grade:sel("fg"),
      oid:sel("fo")||"",
      year:start?new Date(start).getFullYear():null,
    };
    var arr=getSaved();
    if(EDITING_NR)arr=arr.filter(function(r){return r._id!==EDITING_NR});
    arr.push(rec);setSaved(arr);
    EDITING_NR=null;
    rebuildSLM();updateBadge();
    msg.style.color="#66BB6A";msg.textContent="Saved! Charts updated.";
    setTimeout(function(){doNewRecord();refresh();},600);
  });
  if(gel("btn-cancel-edit")){
    gel("btn-cancel-edit").addEventListener("click",function(){EDITING_NR=null;doNewRecord();});
  }
  gel("btn-clear").addEventListener("click",function(){EDITING_NR=null;doNewRecord();});
  gel("btn-export").addEventListener("click",function(){
    var arr=getSaved();if(!arr.length){alert("No saved records.");return;}
    var hdr=["Name","Badge","Course","Location","Region","Country","Start","End","Status","Score","Hours","Position","Grade","Offering ID"];
    var rows=arr.map(function(r){
      return[r.name,r.badge,r.course,r.loc,r.region,r.country,
        r.start,r.end,r.status,r.score||"",r.hours||"",r.position,r.grade,r.oid]
        .map(function(v){return"\""+String(v||"").replace(/"/g,"\"\"")+"\"";}).join(",");
    });
    var csv=[hdr.join(",")].concat(rows).join("\n");
    var a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
    a.download="NAVIGATE_Records_"+new Date().toISOString().slice(0,10)+".csv";
    a.click();
  });
  gel("btn-clearall").addEventListener("click",function(){
    if(!confirm("Delete ALL saved records? Cannot be undone."))return;
    setSaved([]);rebuildSLM();EDITING_NR=null;updateBadge();doNewRecord();refresh();
  });

  renderSaved();updateBadge();
}
function renderSaved(){
  var arr=getSaved();
  var sl=gel("slist"),sn=gel("snone"),sc=gel("scnt");
  if(sc)sc.textContent="("+arr.length+")";
  if(!arr.length){if(sl)sl.innerHTML="";if(sn)sn.style.display="block";return;}
  if(sn)sn.style.display="none";
  if(!sl)return;
  sl.innerHTML=arr.slice().reverse().map(function(r){
    var bc=r.status==="Passed"?"bp":r.status==="Failed"?"bf":"bn";
    return "<div class=\"rc\"><div style=\"flex:1;min-width:0\">"
      +"<div style=\"font-size:12px;font-weight:600;margin-bottom:4px\">"+esc(r.name)+"</div>"
      +"<div style=\"font-size:11px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap\">"
        +"<span>"+esc(r.course)+"</span>"
        +"<span style=\"color:"+(RC[r.region]||"var(--muted)")+"\">"+esc(r.loc)+" - "+r.region+"</span>"
        +"<span>"+esc(r.start)+"</span>"
        +"<span class=\"b "+bc+"\">"+r.status+"</span>"
        +(r.score?"<span style=\"color:#14A8B0\">"+r.score+"</span>":"")
      +"</div></div>"
      +"<div style=\"display:flex;gap:4px;flex-shrink:0\">"
        +"<button class=\"ib\" data-edit=\""+r._id+"\" title=\"Edit\">Edit</button>"
        +"<button class=\"ib\" data-del=\""+r._id+"\" title=\"Delete\">Del</button>"
      +"</div></div>";
  }).join("");
  // Event delegation for edit/delete buttons
  sl.addEventListener("click",function(e){
    var editBtn=e.target.closest("[data-edit]");
    var delBtn=e.target.closest("[data-del]");
    if(editBtn){EDITING_NR=parseInt(editBtn.getAttribute("data-edit"));doNewRecord();}
    if(delBtn){
      var id=parseInt(delBtn.getAttribute("data-del"));
      setSaved(getSaved().filter(function(r){return r._id!==id}));
      if(EDITING_NR===id)EDITING_NR=null;
      rebuildSLM();updateBadge();doNewRecord();refresh();
    }
  });
}
function updateBadge(){
  var n=getSaved().length;
  var el=gel("nbg-nr");
  if(el){el.textContent=n;el.style.background=n>0?"#E65100":"#0A7B80";}
}

/* ── DATABASE ───────────────────────────────────────────────────── */
function buildDBRecs(){
  var ov=getOV(),del=getDel(),saved=getSaved();
  var base=BASE_SLM.map(function(r,i){
    return{_id:"b"+i,_src:"base",
      name:r[0],course:r[1],location:r[2],region:r[3],
      startDate:r[4],status:r[5]==="P"?"Passed":r[5]==="F"?"Failed":"Pending",
      score:r[6],year:r[7],oid:r[8]};
  });
  var news=saved.map(function(r){
    return{_id:"n"+r._id,_src:"new",_sid:r._id,
      name:r.name,course:r.course,location:r.loc,region:r.region,
      startDate:r.start?r.start.slice(0,7):r.start,
      status:r.status,score:r.score,year:r.year,oid:r.oid};
  });
  return base.concat(news)
    .filter(function(r){return!del.has(r._id)})
    .map(function(r){
      var o=ov[r._id];
      return o?Object.assign({},r,o,{_id:r._id,_src:r._src}):r;
    });
}
function doDatabase(){
  var yrOpts=YEARS.map(function(y){return"<option>"+y+"</option>"}).join("");
  gel("v-database").innerHTML=
    "<div class=\"note\"><strong>Database Manager</strong>"
      +" - Edit or delete any record. Click Edit to modify inline. Changes persist in your browser.</div>"
    +"<div class=\"dbs\" id=\"dbst\"></div>"
    +"<div class=\"fr\" style=\"margin-bottom:12px\" id=\"db-flt\"></div>"
    +"<div class=\"sc\" style=\"padding:0;overflow:hidden\">"
      +"<div class=\"tw\" style=\"max-height:600px\"><table id=\"tdbl\"></table></div></div>";

  gel("db-flt").innerHTML=
    "<input type=\"text\" placeholder=\"Search name/course/offering...\" id=\"dbs\" style=\"width:220px\">"
    +"<select id=\"dbyr\"><option value=\"\">All Years</option>"+yrOpts+"</select>"
    +"<select id=\"dbrg\"><option value=\"\">All Regions</option>"+REGS.map(function(r){return"<option>"+r+"</option>"}).join("")+"</select>"
    +"<select id=\"dbst2\"><option value=\"\">All Statuses</option><option>Passed</option><option>Failed</option><option>Pending</option></select>"
    +"<select id=\"dbsr\"><option value=\"\">All Sources</option><option value=\"base\">Base (887)</option><option value=\"new\">My Additions</option></select>"
    +"<span style=\"font-size:11px;color:var(--muted)\" id=\"dbcnt\"></span>"
    +"<button class=\"btn btng\" id=\"btn-expdb\" style=\"margin-left:auto;font-size:10px;padding:5px 12px\">Export CSV</button>"
    +"<button class=\"btn btng\" id=\"btn-resetdb\" style=\"font-size:10px;padding:5px 12px\">Reset Edits</button>";

  gel("db-flt").addEventListener("change",renderDB);
  gel("dbs").addEventListener("input",renderDB);
  gel("btn-expdb").addEventListener("click",exportDB);
  gel("btn-resetdb").addEventListener("click",function(){
    if(!confirm("Reset ALL edits and deletions? Original records will be restored."))return;
    setOV({});setDel(new Set());rebuildSLM();doDatabase();refresh();
  });
  renderDB();
}
function dbStats(){
  var dbr=buildDBRecs();
  var p=dbr.filter(function(r){return r.status==="Passed"}).length;
  var f=dbr.filter(function(r){return r.status==="Failed"}).length;
  var prv=p+f>0?Math.round(p/(p+f)*100):0;
  var el=gel("dbst");
  if(el)el.innerHTML=
    "<span>Total: <strong>"+dbr.length+"</strong></span>"
    +"<span>Pass rate: <strong style=\"color:"+(prv>=80?"#66BB6A":prv>=65?"#FFA726":"#EF5350")+"\">"+prv+"%</strong></span>"
    +"<span>Edited: <strong style=\"color:#64B5F6\">"+Object.keys(getOV()).length+"</strong></span>"
    +"<span>Deleted: <strong style=\"color:#EF5350\">"+getDel().size+"</strong></span>"
    +"<span>Added: <strong style=\"color:#FFB74D\">"+getSaved().length+"</strong></span>";
}
function renderDB(){
  dbStats();
  var dbr=buildDBRecs();
  var q=(sel("dbs")||"").toLowerCase();
  var yr=sel("dbyr"),rg=sel("dbrg"),st=sel("dbst2"),src=sel("dbsr");
  var data=dbr.filter(function(r){
    return(!yr||String(r.year)===yr)&&(!rg||r.region===rg)
      &&(!st||r.status===st)&&(!src||r._src===src)
      &&(!q||r.name.toLowerCase().includes(q)||r.course.toLowerCase().includes(q)||(r.oid||"").toLowerCase().includes(q));
  });
  var cnt=gel("dbcnt");if(cnt)cnt.textContent=data.length.toLocaleString()+" records";
  var cOpts=COURSES.map(function(c){return"<option>"+esc(c)+"</option>"}).join("");
  var lOpts=LOCS.map(function(l){return"<option>"+l+"</option>"}).join("");
  var h="<thead><tr><th>Src</th><th>Name</th><th>Course</th><th>Location</th><th>Region</th><th>Date</th><th>Status</th><th>Score</th><th>Offering ID</th><th>Actions</th></tr></thead><tbody>";
  data.slice(0,500).forEach(function(r){
    var sb=r._src==="base"?"<span class=\"srcb\">Base</span>":"<span class=\"srcn\">Added</span>";
    var sc=r.status==="Passed"?"bp":r.status==="Failed"?"bf":"bn";
    if(EDITING_DB===r._id){
      h+="<tr class=\"er\"><td>"+sb+"</td>"
        +"<td><input id=\"ei-n\" value=\""+esc(r.name)+"\"></td>"
        +"<td><select id=\"ei-c\">"+COURSES.map(function(c){return"<option"+(c===r.course?" selected":"")+">"+esc(c)+"</option>"}).join("")+"</select></td>"
        +"<td><select id=\"ei-l\">"+LOCS.map(function(l){return"<option"+(l===r.location?" selected":"")+">"+l+"</option>"}).join("")+"</select></td>"
        +"<td><input id=\"ei-r\" readonly value=\""+(LR[r.location]||r.region||"")+"\" style=\"color:var(--teal2);width:52px\"></td>"
        +"<td><input type=\"date\" id=\"ei-d\" value=\""+(r.startDate&&r.startDate.length===7?r.startDate+"-01":r.startDate||"")+"\" style=\"width:130px\"></td>"
        +"<td><select id=\"ei-s\"><option"+(r.status==="Passed"?" selected":"")+">Passed</option><option"+(r.status==="Failed"?" selected":"")+">Failed</option><option"+(r.status==="Pending"?" selected":"")+">Pending</option></select></td>"
        +"<td><input type=\"number\" id=\"ei-sc\" value=\""+(r.score||"")+"\" min=\"0\" max=\"100\" step=\"0.1\" style=\"width:60px\"></td>"
        +"<td><input id=\"ei-o\" value=\""+esc(r.oid||"")+"\" style=\"color:var(--teal2)\"></td>"
        +"<td style=\"white-space:nowrap\">"
          +"<button class=\"ib\" data-commit=\""+r._id+"\" style=\"color:#66BB6A\">Save</button>"
          +"<button class=\"ib\" data-cancel-edit style=\"color:#FFA726\">Cancel</button>"
        +"</td></tr>";
    }else{
      h+="<tr><td>"+sb+"</td>"
        +"<td style=\"font-weight:500;min-width:120px;max-width:170px;overflow:hidden;text-overflow:ellipsis\">"+esc(r.name)+"</td>"
        +"<td style=\"max-width:155px;overflow:hidden;text-overflow:ellipsis\">"+esc(r.course)+"</td>"
        +"<td>"+esc(r.location)+"</td><td>"+regB(r.region)+"</td>"
        +"<td style=\"font-size:10px;color:var(--muted)\">"+(r.startDate?r.startDate.slice(0,7):"-")+"</td>"
        +"<td><span class=\"b "+sc+"\">"+r.status+"</span></td>"
        +"<td>"+scoreBar(r.score)+"</td>"
        +"<td style=\"font-size:10px;color:#14A8B0;max-width:140px;overflow:hidden;text-overflow:ellipsis\">"+(r.oid?esc(r.oid):"-")+"</td>"
        +"<td style=\"white-space:nowrap\">"
          +"<button class=\"ib\" data-dbedit=\""+r._id+"\">Edit</button>"
          +"<button class=\"ib\" data-dbdel=\""+r._id+"\">Del</button>"
        +"</td></tr>";
    }
  });
  if(data.length>500)h+="<tr><td colspan=\"10\" style=\"text-align:center;color:var(--muted);padding:10px\">Showing 500 of "+data.length+" - filter to narrow</td></tr>";
  var tEl=gel("tdbl");
  if(tEl){
    tEl.innerHTML=h+"</tbody>";
    tEl.addEventListener("click",function(e){
      var editBtn=e.target.closest("[data-dbedit]");
      var delBtn=e.target.closest("[data-dbdel]");
      var commitBtn=e.target.closest("[data-commit]");
      var cancelBtn=e.target.closest("[data-cancel-edit]");
      if(editBtn){EDITING_DB=editBtn.getAttribute("data-dbedit");renderDB();}
      if(delBtn){dbDel(delBtn.getAttribute("data-dbdel"));}
      if(commitBtn){dbCommit(commitBtn.getAttribute("data-commit"));}
      if(cancelBtn){EDITING_DB=null;renderDB();}
    });
  }
}
function dbCommit(dbid){
  var name=sel("ei-n").trim(),course=sel("ei-c"),loc=sel("ei-l"),
      start=sel("ei-d"),status=sel("ei-s");
  if(!name||!course||!loc||!start||!status){alert("Name, Course, Location, Date and Status are required.");return;}
  var sc=parseFloat(sel("ei-sc"));
  var region=LR[loc]||"";
  var dt=new Date(start);
  var ms=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var oid=sel("ei-o")||(CA[course]||course.slice(0,8))+"_"+loc+"_"+ms[dt.getMonth()]+String(dt.getFullYear()).slice(2);
  var ov=getOV();
  ov[dbid]={name:name,course:course,location:loc,region:region,
    startDate:start.slice(0,7),status:status,score:sc>0?Math.round(sc*10)/10:null,
    year:dt.getFullYear(),oid:oid};
  setOV(ov);
  // Update saved record if it's a new-type record
  var dbr=buildDBRecs();
  var rec=dbr.find(function(r){return r._id===dbid});
  if(rec&&rec._src==="new"&&rec._sid){
    var arr=getSaved();
    var idx=arr.findIndex(function(r){return r._id===rec._sid});
    if(idx>=0)arr[idx]=Object.assign({},arr[idx],{name:name,course:course,loc:loc,region:region,
      start:start,status:status,score:sc>0?Math.round(sc*10)/10:null,year:dt.getFullYear(),oid:oid});
    setSaved(arr);
  }
  EDITING_DB=null;rebuildSLM();renderDB();refresh();
}
function dbDel(dbid){
  if(!confirm("Delete this record from all charts?"))return;
  var dbr=buildDBRecs();
  var rec=dbr.find(function(r){return r._id===dbid});
  if(rec&&rec._src==="new"&&rec._sid){
    setSaved(getSaved().filter(function(r){return r._id!==rec._sid}));
    updateBadge();
  }else{
    var del=getDel();del.add(dbid);setDel(del);
  }
  rebuildSLM();renderDB();refresh();
}
function exportDB(){
  var dbr=buildDBRecs();
  var hdr=["Source","Name","Course","Location","Region","Start","Status","Score","Year","Offering ID"];
  var rows=dbr.map(function(r){
    return[r._src==="base"?"Base":"Added",r.name,r.course,r.location,
      r.region,r.startDate,r.status,r.score||"",r.year||"",r.oid||""]
      .map(function(v){return"\""+String(v||"").replace(/"/g,"\"\"")+"\"";}).join(",");
  });
  var a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([[hdr.join(",")].concat(rows).join("\n")],{type:"text/csv"}));
  a.download="NAVIGATE_DB_"+new Date().toISOString().slice(0,10)+".csv";
  a.click();
}

/* ── INIT ───────────────────────────────────────────────────────── */
buildNav();
buildViews();
rebuildSLM();
updateBadge();
showView("dashboard");

})();
</script>
