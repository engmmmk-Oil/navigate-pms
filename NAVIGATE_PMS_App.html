<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NAVIGATE Training &amp; Competency System — Alkhorayef Petroleum</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --navy:#0F2B46;--teal:#0A7B80;--teal2:#14A8B0;--gold:#D3BE94;
  --green:#1B5E20;--red:#B71C1C;--amber:#E65100;
  --bg:#0C1826;--s1:#111E2E;--s2:#162438;--s3:#1C2E42;
  --b1:#1E3A55;--b2:#2A4A65;
  --tx:#E2EAF2;--muted:#7A9AB5;--dim:#4A6880;
  --me:#1565C0;--kwt:#006064;--afr:#E65100;--lat:#2E7D32;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}

/* LOGIN OVERLAY */
#login-overlay{position:fixed;inset:0;background:rgba(12,24,38,.97);z-index:9999;
  display:flex;align-items:center;justify-content:center;flex-direction:column}
#login-overlay.hidden{display:none}
.login-box{background:var(--s1);border:1px solid var(--b1);border-radius:14px;
  padding:32px 36px;width:340px;box-shadow:0 24px 64px rgba(0,0,0,.7)}
.login-logo{text-align:center;margin-bottom:24px}
.login-logo img{height:56px;width:auto}
.login-title{font-size:14px;font-weight:700;color:var(--tx);margin-bottom:3px}
.login-sub{font-size:11px;color:var(--muted);margin-bottom:20px}
.login-lbl{font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
  color:var(--muted);margin-bottom:5px;display:block}
#pw-input{width:100%;background:var(--s2);border:1px solid var(--b1);color:var(--tx);
  padding:10px 14px;border-radius:8px;font-size:14px;outline:none;margin-bottom:6px}
#pw-input:focus{border-color:var(--teal)}
#pw-err{font-size:11px;color:#EF5350;min-height:16px;margin-bottom:10px}
#pw-btn{width:100%;background:var(--teal);color:#fff;border:none;padding:11px;
  border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
#pw-btn:hover{background:var(--teal2)}


/* NAV */
nav{background:var(--navy);border-bottom:2px solid var(--gold);display:flex;
  align-items:center;padding:0 16px;height:56px;position:sticky;top:0;z-index:100}
.nav-brand{display:flex;align-items:center;gap:12px;margin-right:20px;flex-shrink:0;
  border-right:1px solid rgba(211,190,148,.25);padding-right:20px}
.nav-brand img{height:38px;width:auto}
.nav-t1{font-size:14px;font-weight:700;color:#fff}
.nav-t2{font-size:9px;color:var(--gold);letter-spacing:.5px;text-transform:uppercase}
#tabs{display:flex;flex:1;overflow-x:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{padding:0 13px;height:56px;display:flex;align-items:center;gap:5px;font-size:11px;
  font-weight:500;color:var(--muted);border:none;background:none;cursor:pointer;
  border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s,border-color .15s}
.tab:hover{color:var(--tx)}.tab.on{color:var(--gold);border-bottom-color:var(--gold)}
.tab svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.nbg{background:var(--teal);color:#fff;border-radius:9px;padding:1px 6px;font-size:9px;font-weight:700}
#access-badge{display:flex;align-items:center;gap:6px;padding:0 12px;flex-shrink:0;
  margin-left:4px;border-left:1px solid rgba(211,190,148,.2)}
.abadge{font-size:9px;font-weight:700;padding:3px 8px;border-radius:10px;letter-spacing:.5px}
.abadge-full{background:rgba(10,123,128,.3);color:var(--teal2)}
.abadge-view{background:rgba(211,190,148,.15);color:var(--gold)}
#lock-btn{background:none;border:1px solid rgba(211,190,148,.3);color:var(--muted);
  padding:3px 8px;border-radius:6px;font-size:9px;cursor:pointer;font-weight:600}
#lock-btn:hover{color:var(--tx)}

/* FILTER STRIP */
.ys{background:var(--s1);border-bottom:1px solid var(--b1);display:flex;align-items:center;
  gap:8px;padding:7px 16px;flex-wrap:wrap}
.ys-lbl{font-size:9px;font-weight:700;letter-spacing:.8px;color:var(--gold);text-transform:uppercase}
.yp,.rp{padding:3px 10px;border-radius:14px;font-size:11px;font-weight:600;cursor:pointer;
  border:1px solid var(--b1);background:var(--s2);color:var(--muted);transition:all .15s}
.yp.on{background:var(--teal);border-color:var(--teal);color:#fff}
.rp.on[data-r="All"]{background:var(--teal);border-color:var(--teal);color:#fff}
.rp.on[data-r="ME"]{background:var(--me);border-color:var(--me);color:#fff}
.rp.on[data-r="KWT"]{background:var(--kwt);border-color:var(--kwt);color:#fff}
.rp.on[data-r="Africa"]{background:var(--afr);border-color:var(--afr);color:#fff}
.rp.on[data-r="LATAM"]{background:var(--lat);border-color:var(--lat);color:#fff}
.ys-right{display:flex;gap:6px;align-items:center;margin-left:auto}

/* MAIN */
main{max-width:1500px;margin:0 auto;padding:16px 18px}
.view{display:none}.view.on{display:block}

/* KPI CARDS */
.kg{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin-bottom:14px}
.kc{background:var(--s1);border:1px solid var(--b1);border-radius:10px;padding:13px 15px;
  position:relative;overflow:hidden}
.kc::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--ac,var(--teal))}
.kl{font-size:9px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.kv{font-size:22px;font-weight:800;color:#fff;line-height:1}
.ks{font-size:10px;color:var(--muted);margin-top:3px}
.kt{font-size:10px;font-weight:700;margin-top:2px}
.up{color:#66BB6A}.dn{color:#EF5350}.neu{color:#FFA726}

/* SECTION */
.sc{background:var(--s1);border:1px solid var(--b1);border-radius:10px;padding:15px;margin-bottom:14px}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px;flex-wrap:wrap;gap:8px}
.st{font-size:12px;font-weight:700;color:var(--tx);display:flex;align-items:center;gap:6px}
.sd{width:6px;height:6px;border-radius:50%;background:var(--teal);flex-shrink:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cw{position:relative;width:100%}

/* TABLE */
.tw{overflow-x:auto;max-height:480px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:11px}
thead th{background:var(--s2);padding:8px 10px;text-align:left;font-weight:700;font-size:10px;
  color:var(--muted);letter-spacing:.4px;text-transform:uppercase;border-bottom:1px solid var(--b1);
  white-space:nowrap;position:sticky;top:0;z-index:1}
tbody tr{border-bottom:1px solid var(--b1)}
tbody tr:hover{background:var(--s2)}
td{padding:6px 10px;color:var(--tx);white-space:nowrap;vertical-align:middle}

/* BADGES */
.b{display:inline-flex;align-items:center;padding:2px 7px;border-radius:14px;font-size:10px;font-weight:700}
.bp{background:#1B5E2028;color:#66BB6A;border:1px solid #1B5E2055}
.bf{background:#7F000028;color:#EF5350;border:1px solid #7F000055}
.bn{background:#E6510028;color:#FFA726;border:1px solid #E6510055}
.bme{background:#1565C028;color:#64B5F6;border:1px solid #1565C055}
.bkw{background:#00606428;color:#4DB6AC;border:1px solid #00606455}
.baf{background:#E6510028;color:#FFB74D;border:1px solid #E6510055}
.bla{background:#2E7D3228;color:#81C784;border:1px solid #2E7D3255}
.bot{background:#37474F28;color:#90A4AE;border:1px solid #37474F55}
.prb{font-weight:700;padding:2px 7px;border-radius:6px;font-size:11px;white-space:nowrap}
.prg{background:#1B5E2028;color:#66BB6A}.pra{background:#E6510028;color:#FFA726}
.prr{background:#7F000028;color:#EF5350}
.sbar{display:flex;align-items:center;gap:5px}
.sbtr{flex:1;height:4px;background:var(--b2);border-radius:2px;min-width:30px}
.sbfi{height:100%;border-radius:2px}

/* FORMS & FILTERS */
.fr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fr select,.fr input{background:var(--s2);border:1px solid var(--b1);color:var(--tx);
  padding:6px 10px;border-radius:7px;font-size:11px;outline:none}
.fr select:focus,.fr input:focus{border-color:var(--teal)}
.rr{display:flex;align-items:center;gap:8px}
.rl{width:52px;font-size:11px;font-weight:700}
.rt{flex:1;height:18px;background:var(--s3);border-radius:3px;overflow:hidden}
.rf{height:100%;display:flex;align-items:center;padding-left:6px;font-size:10px;font-weight:700;color:rgba(255,255,255,.9)}
.rv{width:48px;text-align:right;font-size:11px;font-weight:700}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:8px}
.pc{background:var(--s2);border:1px solid var(--b1);border-radius:8px;padding:11px}
.pc:hover{border-color:var(--b2)}
.sp{padding:2px 7px;border-radius:9px;font-size:9px;font-weight:700}
.spc{background:#1B5E2028;color:#66BB6A}.spa{background:#00606428;color:#4DB6AC}
.spp{background:#1565C028;color:#64B5F6}.spx{background:#7F000028;color:#EF5350}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(192px,1fr));gap:12px;margin-bottom:16px}
.fi{display:flex;flex-direction:column;gap:4px}
.fi label{font-size:9px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.fi input,.fi select{background:var(--s2);border:1px solid var(--b1);color:var(--tx);
  padding:8px 10px;border-radius:7px;font-size:12px;outline:none}
.fi input:focus,.fi select:focus{border-color:var(--teal);background:var(--s3)}
.fi input.auto{color:var(--teal2);cursor:default}
.btn{padding:8px 18px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;border:none}
.btnt{background:var(--teal);color:#fff}.btnt:hover{background:var(--teal2)}
.btnr{background:var(--red);color:#fff}
.btng{background:var(--s2);color:var(--muted);border:1px solid var(--b1)}.btng:hover{color:var(--tx)}
.btna{background:var(--gold);color:var(--navy);font-weight:700}
.rc{background:var(--s2);border:1px solid var(--b1);border-radius:8px;padding:11px;
  display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ib{background:none;border:none;cursor:pointer;padding:3px 7px;border-radius:4px;font-size:12px;color:var(--dim)}
.ib:hover{background:var(--s3)}.ibed:hover{color:#64B5F6}.ibdl:hover{color:#EF5350}
.note{background:var(--s2);border-left:3px solid var(--teal);border-radius:0 8px 8px 0;
  padding:10px 14px;font-size:11px;color:var(--muted);margin-bottom:13px}
.note strong{color:var(--teal2)}
.note-g{border-left-color:var(--gold)}.note-g strong{color:var(--gold)}
.er td input,.er td select{background:var(--s3);border:1px solid var(--teal);color:var(--tx);
  padding:3px 6px;border-radius:4px;font-size:10px;outline:none;width:100%}
.er{background:var(--s3)!important}
.srcb{background:rgba(10,123,128,.2);color:#4DB6AC;padding:2px 5px;border-radius:4px;font-size:9px;font-weight:700}
.srcn{background:rgba(211,190,148,.2);color:var(--gold);padding:2px 5px;border-radius:4px;font-size:9px;font-weight:700}
.dbs{display:flex;gap:12px;font-size:11px;color:var(--muted);padding:7px 0;border-bottom:1px solid var(--b1);margin-bottom:10px;flex-wrap:wrap}
.emp-card{background:var(--s2);border:1px solid var(--gold);border-radius:10px;padding:15px;margin-bottom:14px}
.emp-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.emp-name{font-size:15px;font-weight:700;color:#fff}
.emp-oid{font-size:11px;color:var(--gold);font-weight:700}
.emp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:8px}
.emp-f{display:flex;flex-direction:column;gap:2px}
.emp-fl{font-size:9px;color:var(--muted);font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.emp-fv{font-size:11px;color:var(--tx)}
.emp-hist{margin-top:12px;padding-top:12px;border-top:1px solid var(--b1)}
.emp-hist-t{font-size:11px;font-weight:700;color:var(--teal2);margin-bottom:8px}
.prog-wrap{background:var(--s3);border-radius:6px;overflow:hidden;height:22px;position:relative;margin-bottom:4px}
.prog-done{height:100%;background:var(--teal);display:flex;align-items:center;padding-left:8px;
  font-size:10px;font-weight:700;color:#fff;position:absolute;left:0;min-width:2px}
.prog-rem{height:100%;position:absolute;background:repeating-linear-gradient(45deg,
  rgba(211,190,148,.3) 0px,rgba(211,190,148,.3) 4px,transparent 4px,transparent 8px);
  border-left:1px dashed var(--gold)}
.prog-lbl{font-size:10px;color:var(--muted);display:flex;justify-content:space-between;margin-top:2px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--b2);border-radius:3px}
@media(max-width:900px){.g2,.g3,.g4{grid-template-columns:1fr}}
@media(max-width:600px){.kg{grid-template-columns:repeat(2,1fr)}}

/* ═══ HELPERS ═══ */
function prCalc(recs){
  var p=0,f=0;
  recs.forEach(function(r){if(r[5]==="P")p++;else if(r[5]==="F")f++;});
  return p+f>0?Math.round(p/(p+f)*1000)/10:null;
}
function pct(v,t){return t>0?Math.round(v/t*10)/10:0}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;")
  .replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function prB(r){
  if(r===null||r===undefined)return '<span style="color:#948984">—</span>';
  var n=parseFloat(r);
  var col=n>=80?"#2E7D32":n>=65?"#9C4200":"#8B0000";
  var bg=n>=80?"rgba(46,125,50,.15)":n>=65?"rgba(156,66,0,.15)":"rgba(139,0,0,.15)";
  return '<span style="font-weight:700;padding:2px 8px;border-radius:4px;font-size:10px;'
    +'color:'+col+';background:'+bg+'">'+n.toFixed(1)+'%</span>';
}
function stB(s){
  var isP=s==="P"||s==="Passed",isF=s==="F"||s==="Failed";
  var col=isP?"#2E7D32":isF?"#8B0000":"#9C4200";
  var bg=isP?"rgba(46,125,50,.12)":isF?"rgba(139,0,0,.12)":"rgba(156,66,0,.12)";
  var lbl=isP?"Passed":isF?"Failed":"Pending";

    +'color:'+col+';background:'+bg+'">'+lbl+'</span>';

/* ═══ EMPLOYEE LOOKUP ═══ */
function empByOracle(oid){
  var s=String(oid||"").trim();
  if(!s)return null;
  for(var i=0;i<EMP.length;i++){if(EMP[i][0]===s)return EMP[i];}
  return null;
}
function empSearch(q){
  if(!q)return [];
  var qu=q.toUpperCase().trim(),out=[],seen={};
  var byO=empByOracle(qu);
  if(byO){out.push(byO);seen[byO[0]]=1;}
  var key=qu.slice(0,4);
  (EIDX[key]||[]).forEach(function(i){
    var e=EMP[i];
    if(!seen[e[0]]&&e[1].toUpperCase().indexOf(qu)>=0){out.push(e);seen[e[0]]=1;}
  });
  if(qu.length>=3){
    Object.keys(EIDX).forEach(function(k){
      if(k!==key&&k.slice(0,3)===qu.slice(0,3)){
        (EIDX[k]||[]).forEach(function(i){
          var e=EMP[i];
          if(!seen[e[0]]&&e[1].toUpperCase().indexOf(qu)>=0){out.push(e);seen[e[0]]=1;}
        });
      }
    });
  }
  return out.slice(0,15);
}

/* ═══ LOGIN ═══ */
function initLogin(){
  var ov=gel("login-overlay"),inp=gel("pw-input"),btn=gel("pw-btn"),err=gel("pw-err");
  function tryLogin(){
    var pw=inp.value.trim();
    if(pw===PW_FULL){
      ACCESS=2;
      ov.style.display="none";
      showAccessBadge();
      rebuildSLM();
      updateBadge();
    }else if(pw===PW_VIEW){
      ACCESS=1;
      ov.style.display="none";
      showAccessBadge();
      rebuildSLM();
      updateBadge();
    }else{
      err.textContent="Incorrect password. Please try again.";
      inp.value="";
      inp.focus();
      setTimeout(function(){err.textContent="";},3000);
    }
  }
  btn.addEventListener("click",tryLogin);
  inp.addEventListener("keydown",function(e){if(e.key==="Enter")tryLogin();});
  setTimeout(function(){inp.focus();},80);
}

function showAccessBadge(){
  var ab=gel("access-badge");
  if(!ab)return;
  ab.style.display="flex";
  var badgeTxt=ACCESS===2?"FULL ACCESS":"VIEW ONLY";
  var badgeCol=ACCESS===2?"#CFBF9A":"#CCC3BB";
  ab.innerHTML='<span style="font-size:9px;font-weight:700;letter-spacing:.6px;'
    +'padding:3px 9px;border-radius:10px;border:1px solid '+badgeCol+';color:'+badgeCol+'">'+badgeTxt+'</span>'
    +'<button id="lock-btn" style="background:none;border:1px solid rgba(207,191,154,.3);'
    +'color:#948984;padding:3px 9px;border-radius:6px;font-size:9px;cursor:pointer;'
    +'font-family:Arial,sans-serif;font-weight:600">Lock</button>';
  gel("lock-btn").addEventListener("click",function(){
    if(!confirm("Lock NAVIGATE TCS and return to login?"))return;
    ACCESS=0;
    gel("login-overlay").style.display="flex";
    gel("pw-input").value="";
    gel("pw-err").textContent="";
    ab.style.display="none";
    gel("pw-input").focus();
  });
}

function runSearch(){
  var q=(sel("srch-q")||"").trim();
  if(!q)return;
  var res=gel("srch-results");
  var isOracle=/^\d+$/.test(q);
  var empRes=isOracle?[empByOracle(q)].filter(Boolean):empSearch(q);
  var html="";
  if(!empRes.length){
    var hits=SLM.filter(function(r){return r[0].toUpperCase().indexOf(q.toUpperCase())>=0||(r[9]&&r[9]===q)});
    html=!hits.length
      ?'<div style="text-align:center;padding:24px;color:#948984">No results for <strong>'+esc(q)+'</strong></div>'
      :'<div class="nt" style="margin-bottom:10px">'+hits.length+' training records — employee not in HR database.</div>'+mkEmpCard(hits[0][0],null,hits);
  }else{
    if(empRes.length>1)html='<div class="nt" style="margin-bottom:10px">'+empRes.length+' employees matching "'+esc(q)+'"</div>';
    empRes.forEach(function(emp){
      var hist=SLM.filter(function(r){return r[0]===emp[1]||(r[9]&&r[9]===emp[0]);});
      html+=mkEmpCard(emp[1],emp,hist);
    });
  }
  res.innerHTML=html;
}

  var data=BASE_SLM.filter(function(r){return(!yr||String(r[7])===yr)&&(!rg||r[3]===rg)&&(!q||r[0].toLowerCase().includes(q)||(r[9]||"").includes(q)||r[1].toLowerCase().includes(q));});
  var cnt=gel("dbcnt-ro");if(cnt)cnt.textContent=data.length.toLocaleString()+" records";
  var h='<thead><tr><th>Oracle</th><th>Name</th><th>Course</th><th>Loc</th><th>Region</th><th>Date</th><th>Status</th><th>Score</th><th>Offering ID</th></tr></thead><tbody>';
  data.slice(0,500).forEach(function(r){
    h+='<tr><td style="color:#CFBF9A;font-size:10px;font-weight:700">'+(r[9]?esc(r[9]):"—")+'</td>'
      +'<td style="font-weight:600;min-width:108px;max-width:148px;overflow:hidden;text-overflow:ellipsis">'+esc(r[0])+'</td>'
      +'<td style="max-width:140px;overflow:hidden;text-overflow:ellipsis">'+esc(r[1])+'</td>'
      +'<td>'+esc(r[2])+'</td><td>'+regB(r[3])+'</td>'
      +'<td style="font-size:10px;color:#948984">'+esc(r[4])+'</td>'
      +'<td>'+stB(r[5]==="P"?"Passed":r[5]==="F"?"Failed":"Pending")+'</td>'
      +'<td>'+scoreBar(r[6])+'</td>'
      +'<td style="font-size:10px;color:#474454;max-width:120px;overflow:hidden;text-overflow:ellipsis">'+(r[8]?esc(r[8]):"—")+'</td></tr>';
  });
  var tEl=gel("tdbl-ro");if(tEl)tEl.innerHTML=h+"</tbody>";
}
function dbStats(){
  var dbr=buildDBRecs();var p=dbr.filter(function(r){return r.status==="Passed"}).length,f=dbr.filter(function(r){return r.status==="Failed"}).length;var prv=p+f>0?Math.round(p/(p+f)*100):0;
  var el=gel("dbst");
  if(el)el.innerHTML='<span>Total: <strong style="color:#474454">'+dbr.length+'</strong></span><span>Pass rate: <strong style="color:'+(prv>=80?"#2E7D32":prv>=65?"#9C4200":"#8B0000")+'">'+prv+'%</strong></span><span>Edited: <strong style="color:#474454">'+Object.keys(getOV()).length+'</strong></span><span>Deleted: <strong style="color:#8B0000">'+getDel().size+'</strong></span><span>Added: <strong style="color:#CFBF9A">'+getSaved().length+'</strong></span>';
}
function renderDB(){
  dbStats();var dbr=buildDBRecs();var q=(sel("dbs")||"").toLowerCase();var yr=sel("dbyr"),rg=sel("dbrg"),st=sel("dbst2"),src=sel("dbsr");
  var data=dbr.filter(function(r){return(!yr||String(r.year)===yr)&&(!rg||r.region===rg)&&(!st||r.status===st)&&(!src||r._src===src)&&(!q||r.name.toLowerCase().includes(q)||(r.oracle||"").includes(q)||r.course.toLowerCase().includes(q)||(r.oid||"").toLowerCase().includes(q));});
  var cnt=gel("dbcnt");if(cnt)cnt.textContent=data.length.toLocaleString()+" records";
  var h='<thead><tr><th>Src</th><th>Oracle</th><th>Name</th><th>Course</th><th>Loc</th><th>Region</th><th>Date</th><th>Status</th><th>Score</th><th>Offering ID</th><th>Actions</th></tr></thead><tbody>';
  data.slice(0,500).forEach(function(r){
    var sb=r._src==="base"?'<span style="background:rgba(71,68,84,.15);color:#474454;padding:2px 5px;border-radius:3px;font-size:9px;font-weight:700">Base</span>':'<span style="background:rgba(207,191,154,.2);color:#9C4200;padding:2px 5px;border-radius:3px;font-size:9px;font-weight:700">Added</span>';
    if(EDITING_DB===r._id){
      h+='<tr style="background:#F4F2F1"><td>'+sb+'</td><td style="font-size:10px;color:#CFBF9A">'+esc(r.oracle||"")+'</td>'
        +'<td><input id="ei-n" value="'+esc(r.name)+'" style="width:100%;padding:3px 6px;border:1px solid #CFBF9A;border-radius:3px;font-size:10px"></td>'
        +'<td><select id="ei-c" style="font-size:10px;padding:3px">'+COURSES.map(function(c){return"<option"+(c===r.course?" selected":"")+">"+esc(c)+"</option>"}).join("")+'</select></td>'
        +'<td><select id="ei-l" style="font-size:10px;padding:3px">'+LOCS.map(function(l){return"<option"+(l===r.location?" selected":"")+">"+l+"</option>"}).join("")+'</select></td>'
        +'<td><input id="ei-r" readonly value="'+(LR_MAP[r.location]||r.region||"")+'" style="width:44px;font-size:10px;color:#CFBF9A;padding:3px"></td>'
        +'<td><input type="date" id="ei-d" value="'+(r.startDate&&r.startDate.length===7?r.startDate+"-01":r.startDate||"")+'" style="width:118px;font-size:10px;padding:3px"></td>'
        +'<td><select id="ei-s" style="font-size:10px;padding:3px"><option'+(r.status==="Passed"?" selected":"")+'>Passed</option><option'+(r.status==="Failed"?" selected":"")+'>Failed</option><option'+(r.status==="Pending"?" selected":"")+'>Pending</option></select></td>'
        +'<td><input type="number" id="ei-sc" value="'+(r.score||"")+'" min="0" max="100" step="0.1" style="width:54px;font-size:10px;padding:3px"></td>'
        +'<td><input id="ei-o" value="'+esc(r.oid||"")+'" style="width:100%;font-size:10px;color:#474454;padding:3px;border:1px solid #CCC3BB;border-radius:3px"></td>'
        +'<td style="white-space:nowrap"><button style="background:#2E7D32;color:#fff;border:none;cursor:pointer;padding:3px 7px;border-radius:3px;font-size:11px" data-commit="'+r._id+'">Save</button> <button style="background:none;border:1px solid #CCC3BB;cursor:pointer;padding:3px 7px;border-radius:3px;font-size:11px;color:#948984" data-cancel-edit>X</button></td></tr>';
    }else{
      h+='<tr><td>'+sb+'</td>'
        +'<td style="color:#CFBF9A;font-size:10px;font-weight:700">'+(r.oracle?esc(r.oracle):"—")+'</td>'
        +'<td style="font-weight:600;min-width:108px;max-width:150px;overflow:hidden;text-overflow:ellipsis">'+esc(r.name)+'</td>'
        +'<td style="max-width:138px;overflow:hidden;text-overflow:ellipsis">'+esc(r.course)+'</td>'
        +'<td>'+esc(r.location)+'</td><td>'+regB(r.region)+'</td>'
        +'<td style="font-size:10px;color:#948984">'+(r.startDate?r.startDate.slice(0,7):"—")+'</td>'
        +'<td>'+stB(r.status)+'</td><td>'+scoreBar(r.score)+'</td>'
        +'<td style="font-size:10px;color:#474454;max-width:120px;overflow:hidden;text-overflow:ellipsis">'+(r.oid?esc(r.oid):"—")+'</td>'
        +'<td style="white-space:nowrap">'
          +'<button style="background:none;border:1px solid #CCC3BB;cursor:pointer;padding:3px 7px;border-radius:3px;font-size:11px;color:#474454" data-dbedit="'+r._id+'">Edit</button> '
          +'<button style="background:none;border:1px solid #CCC3BB;cursor:pointer;padding:3px 7px;border-radius:3px;font-size:11px;color:#8B0000" data-dbdel="'+r._id+'">Del</button>'
        +'</td></tr>';
    }
  });
  if(data.length>500)h+='<tr><td colspan="11" style="text-align:center;color:#948984;padding:10px">Showing 500 of '+data.length+'</td></tr>';
  var tEl=gel("tdbl");
  if(tEl){tEl.innerHTML=h+"</tbody>";tEl.addEventListener("click",function(e){
    var eb=e.target.closest("[data-dbedit]"),db=e.target.closest("[data-dbdel]"),cb=e.target.closest("[data-commit]"),xb=e.target.closest("[data-cancel-edit]");
    if(eb){EDITING_DB=eb.getAttribute("data-dbedit");renderDB();}
    if(db){dbDel(db.getAttribute("data-dbdel"));}
    if(cb){dbCommit(cb.getAttribute("data-commit"));}
    if(xb){EDITING_DB=null;renderDB();}
  });}
}
function dbCommit(dbid){
  var name=sel("ei-n").trim(),course=sel("ei-c"),loc=sel("ei-l"),start=sel("ei-d"),status=sel("ei-s");
  if(!name||!course||!loc||!start||!status){alert("Name, Course, Location, Date and Status required.");return;}
  var sc=parseFloat(sel("ei-sc"));var region=LR_MAP[loc]||"";var dt=new Date(start);
  var ms=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var oid=sel("ei-o")||((CA[course]||course.slice(0,8))+"_"+loc+"_"+ms[dt.getMonth()]+String(dt.getFullYear()).slice(2));
  var ov=getOV();ov[dbid]={name:name,course:course,location:loc,region:region,startDate:start.slice(0,7),status:status,score:sc>0?Math.round(sc*10)/10:null,year:dt.getFullYear(),oid:oid};setOV(ov);
  var dbr=buildDBRecs();var rec=dbr.find(function(r){return r._id===dbid});
  if(rec&&rec._src==="new"&&rec._sid){var arr=getSaved();var idx=arr.findIndex(function(r){return r._id===rec._sid});if(idx>=0)arr[idx]=Object.assign({},arr[idx],{name:name,course:course,loc:loc,region:region,start:start,status:status,score:sc>0?Math.round(sc*10)/10:null,year:dt.getFullYear(),oid:oid});setSaved(arr);}
  EDITING_DB=null;rebuildSLM();renderDB();refresh();
}
function dbDel(dbid){
  if(!confirm("Delete this record?"))return;
  var dbr=buildDBRecs();var rec=dbr.find(function(r){return r._id===dbid});
  if(rec&&rec._src==="new"&&rec._sid){setSaved(getSaved().filter(function(r){return r._id!==rec._sid}));updateBadge();}
  else{var del=getDel();del.add(dbid);setDel(del);}
  rebuildSLM();renderDB();refresh();
}
function exportDB(){
  var dbr=buildDBRecs();
  var h=["Source","Oracle ID","Name","Course","Location","Region","Start Date","Status","Score","Year","Offering ID"];
  var rows=dbr.map(function(r){return[r._src==="base"?"Base":"Added",r.oracle||"",r.name,r.course,r.location,r.region,r.startDate,r.status,r.score||"",r.year||"",r.oid||""].map(function(v){return'"'+String(v||"").replace(/"/g,'""')+'"';}).join(",");});
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([[h.join(",")].concat(rows).join("\n")],{type:"text/csv"}));a.download="NAVIGATE_DB_"+new Date().toISOString().slice(0,10)+".csv";a.click();
}

/* ═══ INIT ═══ */
buildNav();
buildViews();
showView("dashboard");
initLogin();

})();
</script>
